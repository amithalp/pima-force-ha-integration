name: Feature request
description: Suggest a Home Assistant or PIMA protocol improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe the Home Assistant behavior you need and why.
    validations:
      required: true
  - type: textarea
    id: protocol
    attributes:
      label: Available PIMA protocol evidence
      description: If relevant, cite a JSON document field or provide sanitized panel observations.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, accounts, private addresses, zone/user names and other personal data.
          required: true
